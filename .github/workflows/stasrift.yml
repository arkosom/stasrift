name: stasrift
on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - 'site/**'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest build 'setuptools>=77' wheel
      - run: python -m pytest -q
      - run: python release_smoke.py
      - run: bash verify_release.sh
      - run: python scripts/build_release.py
      - run: python scripts/check_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            dist/stasrift-1.0.1-py3-none-any.whl
            dist/stasrift-1.0.1.tar.gz
            dist/stasrift-1.0.1-source.zip
            dist/SHA256SUMS-1.0.1.txt
  publish:
    if: github.repository == 'arkosom/stasrift' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions-ubuntu-latest-python-3.12
          path: dist
      - run: python scripts/verify_artifacts.py
      - run: sha256sum -c SHA256SUMS-1.0.1.txt
        working-directory: dist
      - run: python -m pip install pytest 'setuptools>=77' wheel ./dist/stasrift-1.0.1-py3-none-any.whl
      - name: Publish founder-authorized maintenance release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
